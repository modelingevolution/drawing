name: Release

# Merge to master: bump = the merged PR's label release:major|minor|patch|none (default minor).
# release.sh is the only version implementation; it tags and pushes. A tag pushed with GITHUB_TOKEN starts
# no other workflow, so this run calls publish-nuget.yml itself with the version release.sh produced.

on:
  push:
    branches: [ master ]
  workflow_dispatch:
    inputs:
      version_bump:
        description: 'Version bump type'
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
          - custom
      custom_version:
        description: 'Custom version X.Y.Z.B (only used if version_bump is custom)'
        required: false
        type: string

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: release-master
  cancel-in-progress: false

jobs:
  tag:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.bump.outputs.skip }}
      bump: ${{ steps.bump.outputs.bump }}
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Configure git user
      run: |
        git config --local user.email "actions@github.com"
        git config --local user.name "GitHub Actions"

    - name: Determine bump
      id: bump
      env:
        GH_TOKEN: ${{ github.token }}
        EVENT: ${{ github.event_name }}
        DISPATCH_BUMP: ${{ github.event.inputs.version_bump }}
        REPO: ${{ github.repository }}
        SHA: ${{ github.sha }}
      run: |
        set -o pipefail
        if [ "$EVENT" = "workflow_dispatch" ]; then
          BUMP="$DISPATCH_BUMP"
        else
          # A failing API call fails the job (no silent default).
          PULLS=$(gh api "repos/$REPO/commits/$SHA/pulls")
          LABELS=$(echo "$PULLS" \
            | jq -r --arg sha "$SHA" '[.[] | select(.merge_commit_sha == $sha)][0].labels // [] | .[].name' \
            | { grep -E '^release:(major|minor|patch|none)$' || true; } | sort -u)
          echo "Merged PR: $(echo "$PULLS" | jq -r --arg sha "$SHA" '[.[] | select(.merge_commit_sha == $sha)][0].number // "none"')"
          COUNT=$(printf '%s' "$LABELS" | grep -c . || true)
          if [ "$COUNT" -gt 1 ]; then
            echo "::error::The merged PR carries more than one release label: ${LABELS//$'\n'/ }"
            exit 1
          fi
          if [ "$COUNT" -eq 1 ]; then
            BUMP="${LABELS#release:}"
          else
            BUMP="minor"
            echo "No release label on the merged PR; default bump: minor"
          fi
        fi
        echo "Bump: $BUMP"
        echo "bump=$BUMP" >> "$GITHUB_OUTPUT"
        if [ "$BUMP" = "none" ]; then
          echo "skip=true" >> "$GITHUB_OUTPUT"
          echo "## Release skipped (release:none)" >> "$GITHUB_STEP_SUMMARY"
        else
          echo "skip=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Tag with release.sh
      id: release
      if: steps.bump.outputs.skip != 'true'
      env:
        BUMP: ${{ steps.bump.outputs.bump }}
        CUSTOM_VERSION: ${{ github.event.inputs.custom_version }}
      run: |
        if [ "$BUMP" = "custom" ]; then
          ./release.sh --version "$CUSTOM_VERSION" --ci
        else
          ./release.sh "--$BUMP" --ci
        fi

    - name: Create GitHub Release
      if: steps.bump.outputs.skip != 'true'
      uses: ncipollo/release-action@v1
      with:
        tag: ${{ steps.release.outputs.tag }}
        name: "ModelingEvolution.Drawing v${{ steps.release.outputs.version }}"
        body: |
          ## ModelingEvolution.Drawing v${{ steps.release.outputs.version }}

          ### Installation
          ```bash
          dotnet add package ModelingEvolution.Drawing --version ${{ steps.release.outputs.version }}
          ```

          ---

          **Full Changelog**: https://github.com/${{ github.repository }}/compare/ModelingEvolution.Drawing/${{ steps.release.outputs.previous }}...${{ steps.release.outputs.tag }}
        draft: false
        prerelease: false
        generateReleaseNotes: true

    - name: Summary
      if: steps.bump.outputs.skip != 'true'
      env:
        BUMP: ${{ steps.bump.outputs.bump }}
        PREVIOUS: ${{ steps.release.outputs.previous }}
        VERSION: ${{ steps.release.outputs.version }}
        TAG: ${{ steps.release.outputs.tag }}
      run: |
        {
          echo "## Release tagged"
          echo ""
          echo "- **Bump**: $BUMP"
          echo "- **Previous Version**: $PREVIOUS"
          echo "- **New Version**: $VERSION"
          echo "- **Tag**: $TAG"
          echo ""
          echo "The publish job of this run builds, tests and pushes the package."
        } >> "$GITHUB_STEP_SUMMARY"

  publish:
    needs: tag
    if: needs.tag.outputs.skip != 'true'
    uses: ./.github/workflows/publish-nuget.yml
    with:
      version: ${{ needs.tag.outputs.version }}
    secrets: inherit
