name: Publish to NuGet

on:
  push:
    tags:
      - 'ModelingEvolution.Drawing/*.*.*.*'
      - 'v*.*.*'  # Also support v-prefixed tags for compatibility
  workflow_call:
    inputs:
      version:
        description: 'Version to publish (X.Y.Z.B or X.Y.Z.B-preview.N)'
        required: true
        type: string
  # Manual re-publish of an EXISTING release tag (e.g. after a failed push): the tag's commit is built.
  workflow_dispatch:
    inputs:
      version:
        description: 'Existing tag version to re-publish (e.g., 1.13.0.71)'
        required: true
        type: string

permissions:
  contents: read
  id-token: write   # Trusted Publishing: GitHub mints an OIDC token, nuget.org swaps it for a 1-hour key

jobs:
  publish:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        # A dispatch run needs the tags to find and check out the release tag.
        fetch-depth: ${{ github.event_name == 'workflow_dispatch' && '0' || '1' }}

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'
    
    - name: Set version
      id: version
      env:
        INPUT_VERSION: ${{ inputs.version }}
      run: |
        # Resolution order: workflow_call input, workflow_dispatch input (both are `inputs.version`), then the tag.
        if [ -n "$INPUT_VERSION" ]; then
          VERSION="$INPUT_VERSION"
        elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
          TAG="${GITHUB_REF#refs/tags/}"
          # Handle both formats: ModelingEvolution.Drawing/1.0.57.35 and v1.0.57.35
          if [[ "$TAG" == ModelingEvolution.Drawing/* ]]; then
            VERSION="${TAG#ModelingEvolution.Drawing/}"
          else
            VERSION="${TAG#v}"
          fi
        else
          echo "::error::No version: not called with an input and not run on a tag (ref: $GITHUB_REF)"
          exit 1
        fi
        if ! [[ "$VERSION" =~ ^[0-9]+(\.[0-9]+){2,3}(-preview\.[0-9]+)?$ ]]; then
          echo "::error::Invalid version: $VERSION"
          exit 1
        fi
        # AssemblyVersion/FileVersion cannot carry a pre-release suffix.
        NUMERIC="${VERSION%%-*}"
        echo "Version: $VERSION (assembly/file version: $NUMERIC)"
        echo "VERSION=$VERSION" >> $GITHUB_ENV
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "numeric=$NUMERIC" >> $GITHUB_OUTPUT

    # Also true when release.yml was itself dispatched and calls this workflow: its tag was just pushed on the
    # same commit, so the check passes and the checkout is a no-op.
    - name: Check out the release tag (workflow_dispatch only)
      if: github.event_name == 'workflow_dispatch'
      env:
        VERSION: ${{ steps.version.outputs.version }}
      run: |
        TAG="ModelingEvolution.Drawing/$VERSION"
        if ! git rev-parse -q --verify "refs/tags/$TAG" > /dev/null; then
          echo "::error::Tag $TAG does not exist; a manual run only re-publishes an existing release tag"
          exit 1
        fi
        git checkout -q "refs/tags/$TAG"
        echo "Building $TAG at $(git rev-parse HEAD)"

    - name: Update version in csproj
      env:
        VERSION: ${{ steps.version.outputs.version }}
        NUMERIC: ${{ steps.version.outputs.numeric }}
      run: |
        cd Sources/ModelingEvolution.Drawing
        sed -i "s/<AssemblyVersion>.*<\/AssemblyVersion>/<AssemblyVersion>$NUMERIC<\/AssemblyVersion>/" ModelingEvolution.Drawing.csproj
        sed -i "s/<FileVersion>.*<\/FileVersion>/<FileVersion>$NUMERIC<\/FileVersion>/" ModelingEvolution.Drawing.csproj
        sed -i "s/<Version>.*<\/Version>/<Version>$VERSION<\/Version>/" ModelingEvolution.Drawing.csproj
        sed -i "s/<PackageVersion>.*<\/PackageVersion>/<PackageVersion>$VERSION<\/PackageVersion>/" ModelingEvolution.Drawing.csproj
        grep -E "<(AssemblyVersion|FileVersion|Version|PackageVersion)>" ModelingEvolution.Drawing.csproj

    - name: Restore dependencies
      working-directory: ./Sources
      run: dotnet restore
    
    - name: Build
      working-directory: ./Sources
      run: dotnet build --configuration Release --no-restore
    
    - name: Run tests (a red suite publishes nothing)
      working-directory: ./Sources
      run: dotnet test --configuration Release --no-build --verbosity normal
    
    - name: Pack
      working-directory: ./Sources/ModelingEvolution.Drawing
      run: dotnet pack --configuration Release --no-build --output ./nupkg /p:PackageVersion=${{ steps.version.outputs.version }}
    
    # nuget.org Trusted Publishing: no long-lived key. The policy on nuget.org names this repo and this
    # workflow file; NUGET_USER is the nuget.org profile name that owns the package (not an e-mail).
    - name: NuGet login (OIDC → temporary API key)
      id: nuget_login
      uses: NuGet/login@v1
      with:
        user: ${{ secrets.NUGET_USER }}

    - name: Push to NuGet
      working-directory: ./Sources/ModelingEvolution.Drawing
      run: |
        dotnet nuget push ./nupkg/ModelingEvolution.Drawing.*.nupkg \
          --api-key ${{ steps.nuget_login.outputs.NUGET_API_KEY }} \
          --source https://api.nuget.org/v3/index.json \
          --skip-duplicate

    - name: Publish to ModelingEvolution NuGet
      working-directory: ./Sources/ModelingEvolution.Drawing
      run: |
        dotnet nuget push "./nupkg/*.nupkg" \
          --api-key ${{ secrets.NUGET_API_KEY_ME }} \
          --source https://nuget.modelingevolution.com/v3/index.json \
          --skip-duplicate
      continue-on-error: true

    - name: Summary
      run: |
        echo "## ModelingEvolution.Drawing Published to NuGet" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "- **Version**: ${{ steps.version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Package**: ModelingEvolution.Drawing" >> $GITHUB_STEP_SUMMARY
        echo "- **NuGet**: https://www.nuget.org/packages/ModelingEvolution.Drawing" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Features" >> $GITHUB_STEP_SUMMARY
        echo "- Generic 2D math types (Point, Vector, Rectangle, Size)" >> $GITHUB_STEP_SUMMARY
        echo "- Bezier curves and spline support" >> $GITHUB_STEP_SUMMARY
        echo "- Polar coordinates and angle conversions" >> $GITHUB_STEP_SUMMARY
        echo "- Matrix transformations" >> $GITHUB_STEP_SUMMARY
        echo "- HSV color space" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Install with:" >> $GITHUB_STEP_SUMMARY
        echo '```bash' >> $GITHUB_STEP_SUMMARY
        echo 'dotnet add package ModelingEvolution.Drawing --version ${{ steps.version.outputs.version }}' >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY