name: Release

# Merge to master: bump = the merged PR's label release:major|minor|patch|none (minor when the PR has no label;
# a push with no merged PR fails, releases come from labelled PRs). release.sh is the only version
# implementation; it tags and pushes. A tag pushed with GITHUB_TOKEN starts no other workflow, so this run calls
# publish-nuget.yml itself with the version release.sh produced. Order: test -> tag -> publish -> GitHub Release.
#
# No `concurrency` group on purpose: GitHub keeps one PENDING run per group and cancels it when a third run
# queues, so a release:major merge could be dropped without anyone noticing. Without it, two overlapping runs
# race loudly instead: release.sh refuses an existing tag and the publish push uses --skip-duplicate, so the
# loser fails and the lead re-runs it.

on:
  push:
    branches: [ master ]
  workflow_dispatch:
    inputs:
      version_bump:
        description: 'Version bump type'
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
          - custom
      custom_version:
        description: 'Custom version X.Y.Z.B (only used if version_bump is custom)'
        required: false
        type: string

permissions:
  contents: write
  pull-requests: read

jobs:
  tag:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.bump.outputs.skip }}
      bump: ${{ steps.bump.outputs.bump }}
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      previous: ${{ steps.release.outputs.previous }}

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Configure git user
      run: |
        git config --local user.email "actions@github.com"
        git config --local user.name "GitHub Actions"

    - name: Determine bump
      id: bump
      env:
        GH_TOKEN: ${{ github.token }}
        EVENT: ${{ github.event_name }}
        DISPATCH_BUMP: ${{ github.event.inputs.version_bump }}
        CUSTOM_VERSION: ${{ github.event.inputs.custom_version }}
        REPO: ${{ github.repository }}
        SHA: ${{ github.sha }}
      run: |
        set -o pipefail
        if [ "$EVENT" = "workflow_dispatch" ]; then
          BUMP="$DISPATCH_BUMP"
          if [ "$BUMP" = "custom" ] && [ -z "$CUSTOM_VERSION" ]; then
            echo "::error::version_bump is custom but custom_version is empty"
            exit 1
          fi
        else
          # The commit -> PR association can lag right after a merge: retry. A failing API call fails the job.
          PR=""
          for attempt in 1 2 3 4; do
            PR=$(gh api "repos/$REPO/commits/$SHA/pulls" \
              | jq -c --arg sha "$SHA" '[.[] | select(.merge_commit_sha == $sha)][0] // empty')
            [ -n "$PR" ] && break
            if [ "$attempt" -lt 4 ]; then
              echo "No merged PR for $SHA yet (attempt $attempt); retrying in 10 s"
              sleep 10
            fi
          done
          if [ -z "$PR" ]; then
            echo "::error::No merged PR found for $SHA; releases come from labelled PRs. Re-run via workflow_dispatch if this was intended."
            exit 1
          fi
          echo "Merged PR: #$(echo "$PR" | jq -r '.number')"
          LABELS=$(echo "$PR" | jq -r '.labels[].name' \
            | { grep -E '^release:(major|minor|patch|none)$' || true; } | sort -u)
          COUNT=$(printf '%s' "$LABELS" | grep -c . || true)
          if [ "$COUNT" -gt 1 ]; then
            echo "::error::The merged PR carries more than one release label: ${LABELS//$'\n'/ }"
            exit 1
          fi
          if [ "$COUNT" -eq 1 ]; then
            BUMP="${LABELS#release:}"
          else
            BUMP="minor"
            echo "The merged PR has no release label; default bump: minor"
          fi
        fi
        echo "Bump: $BUMP"
        echo "bump=$BUMP" >> "$GITHUB_OUTPUT"
        if [ "$BUMP" = "none" ]; then
          echo "skip=true" >> "$GITHUB_OUTPUT"
          echo "## Release skipped (release:none)" >> "$GITHUB_STEP_SUMMARY"
        else
          echo "skip=false" >> "$GITHUB_OUTPUT"
        fi

    # Nothing is tagged while the suite is red. Tests write outside the repo; a dirty tree here is a defect.
    - name: Setup .NET
      if: steps.bump.outputs.skip != 'true'
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore
      if: steps.bump.outputs.skip != 'true'
      working-directory: ./Sources
      run: dotnet restore

    - name: Build
      if: steps.bump.outputs.skip != 'true'
      working-directory: ./Sources
      run: dotnet build --configuration Release --no-restore

    - name: Test
      if: steps.bump.outputs.skip != 'true'
      working-directory: ./Sources
      run: dotnet test --configuration Release --no-build --verbosity normal

    - name: Tag with release.sh
      id: release
      if: steps.bump.outputs.skip != 'true'
      env:
        BUMP: ${{ steps.bump.outputs.bump }}
        CUSTOM_VERSION: ${{ github.event.inputs.custom_version }}
      run: |
        if [ "$BUMP" = "custom" ]; then
          ./release.sh --version "$CUSTOM_VERSION" --ci
        else
          ./release.sh "--$BUMP" --ci
        fi

  publish:
    needs: tag
    if: needs.tag.outputs.skip != 'true'
    uses: ./.github/workflows/publish-nuget.yml
    with:
      version: ${{ needs.tag.outputs.version }}
    secrets: inherit

  # The public GitHub Release exists only after the package was pushed.
  github-release:
    needs: [ tag, publish ]
    if: needs.tag.outputs.skip != 'true'
    runs-on: ubuntu-latest

    steps:
    - name: Create GitHub Release
      uses: ncipollo/release-action@v1
      with:
        tag: ${{ needs.tag.outputs.tag }}
        name: "ModelingEvolution.Drawing v${{ needs.tag.outputs.version }}"
        body: |
          ## ModelingEvolution.Drawing v${{ needs.tag.outputs.version }}

          ### Installation
          ```bash
          dotnet add package ModelingEvolution.Drawing --version ${{ needs.tag.outputs.version }}
          ```

          ---

          **Full Changelog**: https://github.com/${{ github.repository }}/compare/ModelingEvolution.Drawing/${{ needs.tag.outputs.previous }}...${{ needs.tag.outputs.tag }}
        draft: false
        prerelease: false
        generateReleaseNotes: true

    - name: Summary
      env:
        BUMP: ${{ needs.tag.outputs.bump }}
        PREVIOUS: ${{ needs.tag.outputs.previous }}
        VERSION: ${{ needs.tag.outputs.version }}
        TAG: ${{ needs.tag.outputs.tag }}
      run: |
        {
          echo "## Released"
          echo ""
          echo "- **Bump**: $BUMP"
          echo "- **Previous Version**: $PREVIOUS"
          echo "- **New Version**: $VERSION"
          echo "- **Tag**: $TAG"
        } >> "$GITHUB_STEP_SUMMARY"
